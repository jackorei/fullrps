<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">  
</head>
<body>
    <div id="title">
        <div class="viewmode">
            <button class="ndb" id="day">☀️</button>
            <button class="ndb" id="night">🌙</button>
        </div>
        <div class="titlecred">
            <a href="index.html"><div class="rtitle">Rock Paper Scissors</div></a>
        </div>
        <div class="rulesdiv">
            <a href="rules.html"><div class="rules">?</div></a>
        </div>
    </div>
    <div id="backgroundp">
    <div id="baldiv">
        <div class="balance">
            <div id="currentbal"><span id="dollar">$</span> <span class="money"></span></div>
        </div>
    </div>
    <div id="game">
        <div class="instruct">Place your bet!</div>
        <div class="betdisp"></div>
        <div class="bet">
            <button class="adjustbet" id="allin">All</button>
            <button class="adjustbet" id="double">2x</button>
            <button class="adjustbet" id="halfer">1/2</button>
            <input id="betbox" type="number">
            <button id="placebet">Bet</button>
        </div>
        <div>
            <div id="betmsg"></div>
        </div>
        <div class="allbuttons">
            <button class="rpsbutton" id="rock">Rock</button>
            <button class="rpsbutton" id="paper">Paper</button>
            <button class="rpsbutton" id="scissors">Scissors</button>
        </div>
        <div id="allresult">
            <div class="res" id="resultone"></div>
            <div class="res" id="resulttwo"></div>
            <div class="res" id="resultthree"></div>
            <div id="resultfour"></div>
            <div id="finalscore">Final Score:</div>
            <div class="res" id="score"></div>
            <div class="res" id="resultend"></div>
            <button id="reset">PLAY AGAIN</button>
        </div>
    </div>
    </div>
</body>
</html>
